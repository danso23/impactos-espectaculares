name: Deploy Backend (Manual)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: desarrollo
        type: choice
        options:
          - desarrollo
          - main

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          security: loose
          local-dir: espectacularesapi/
          server-dir: ${{ secrets.BACKEND_FTP_SERVER_DIR }}
          exclude: |
            **/.env
            **/.htaccess
            **/storage/**
            **/storage
            **/public/storage/**
            **/public/storage
