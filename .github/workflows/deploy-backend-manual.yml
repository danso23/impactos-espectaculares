name: Deploy Backend (Manual)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: desarrollo
        type: choice
        options:
          - desarrollo
          - main
      run_migrations:
        description: Run php artisan migrate --force after deploy
        required: true
        default: no
        type: choice
        options:
          - no
          - yes

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -e

            SOURCE_PATH="${{ secrets.BACKEND_SOURCE_PATH }}"
            TARGET_PATH="${{ secrets.BACKEND_TARGET_PATH }}"
            PHP_BIN="${{ vars.PHP_BIN }}"

            if [ -z "$PHP_BIN" ]; then
              PHP_BIN=php
            fi

            mkdir -p "$TARGET_PATH"
            mkdir -p "$TARGET_PATH/public"

            cd "$SOURCE_PATH/espectacularesapi"
            tar --exclude=.env --exclude=public/storage --exclude=storage -cf - . | (cd "$TARGET_PATH" && tar -xf -)

            if [ ! -e "$TARGET_PATH/public/storage" ]; then
              ln -s ../storage/app/public "$TARGET_PATH/public/storage"
            fi

            "$PHP_BIN" "$TARGET_PATH/artisan" config:clear
            "$PHP_BIN" "$TARGET_PATH/artisan" cache:clear

            if [ "${{ inputs.run_migrations }}" = "yes" ]; then
              "$PHP_BIN" "$TARGET_PATH/artisan" migrate --force
            fi
