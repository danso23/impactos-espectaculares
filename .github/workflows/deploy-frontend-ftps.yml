name: Deploy Frontend (FTPS)

on:
  push:
    branches:
      - desarrollo
  pull_request:
    branches:
      - desarrollo
  workflow_dispatch: {}

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: espectacularesweb/package-lock.json

      - name: Install deps
        working-directory: espectacularesweb
        run: npm install --no-audit --no-fund

      - name: Create .env.production
        working-directory: espectacularesweb
        run: |
          printf 'VITE_API_URL=%s\nVITE_APP_ENV=production\n' "${{ vars.VITE_API_URL }}" > .env.production

      - name: Build
        working-directory: espectacularesweb
        run: npm run build:prod

      - name: Deploy via FTPS
        if: github.event_name == 'push'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          security: loose
          local-dir: espectacularesweb/dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.htaccess
