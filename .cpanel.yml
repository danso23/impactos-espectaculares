---
deployment:
  tasks:
    - export API_PATH=/home2/enticonfiamos/public_html/espectacularesapi
    - export APP_PATH=/home2/enticonfiamos/app.enticonfiamos.com.mx
    - export RUN_SEEDERS=false

    - /bin/mkdir -p $API_PATH
    - /bin/mkdir -p $APP_PATH

    # Backend
    - /bin/cp -R espectacularesapi/* $API_PATH
    - /usr/local/bin/php $API_PATH/artisan migrate --force
    - if [ "$RUN_SEEDERS" = "true" ]; then /usr/local/bin/php $API_PATH/artisan db:seed --class=Database\\Seeders\\QuoteStatusSeeder --force; fi
    - if [ "$RUN_SEEDERS" = "true" ]; then /usr/local/bin/php $API_PATH/artisan db:seed --class=Database\\Seeders\\QuoteCatalogSeeder --force; fi

    # Frontend compilado
    - /bin/cp -R espectacularesweb/dist/* $APP_PATH
