---
deployment:
  tasks:
    - >-
      /bin/sh -c 'echo "=== DEPLOY START ===" > /home1/impactos/deploy_full.log 2>&1'
    - >-
      /bin/sh -c '/bin/date >> /home1/impactos/deploy_full.log 2>&1'
    - >-
      /bin/sh -c '/bin/mkdir -p /home1/impactos/espectacularesapi/public /home1/impactos/espectacularesapi/storage/app/public /home1/impactos/espectacularesapi/storage/framework/cache/data /home1/impactos/espectacularesapi/storage/framework/sessions /home1/impactos/espectacularesapi/storage/framework/views /home1/impactos/espectacularesapi/storage/logs >> /home1/impactos/deploy_full.log 2>&1'
    - >-
      /bin/sh -c 'cd espectacularesapi && /usr/bin/tar --exclude=.env --exclude=public/storage --exclude=storage -cf - . | (cd /home1/impactos/espectacularesapi && /usr/bin/tar -xf -) >> /home1/impactos/deploy_full.log 2>&1'
    - >-
      /bin/sh -c 'if [ ! -f /home1/impactos/espectacularesapi/.env ]; then echo "ERROR - Falta el archivo .env de producción." >> /home1/impactos/deploy_full.log; exit 1; fi'
    - >-
      /bin/sh -c 'if [ -x /opt/cpanel/composer/bin/composer ]; then COMPOSER=/opt/cpanel/composer/bin/composer; elif [ -x /usr/local/bin/composer ]; then COMPOSER=/usr/local/bin/composer; else echo "ERROR - Composer no está disponible en el servidor." >> /home1/impactos/deploy_full.log; exit 1; fi; cd /home1/impactos/espectacularesapi && $COMPOSER install --no-dev --prefer-dist --optimize-autoloader --no-interaction >> /home1/impactos/deploy_full.log 2>&1'
    - >-
      /bin/sh -c 'if [ ! -e /home1/impactos/espectacularesapi/public/storage ] && [ ! -L /home1/impactos/espectacularesapi/public/storage ]; then /bin/ln -s ../storage/app/public /home1/impactos/espectacularesapi/public/storage >> /home1/impactos/deploy_full.log 2>&1; fi'
    - >-
      /bin/sh -c '/usr/local/bin/php /home1/impactos/espectacularesapi/artisan migrate --force >> /home1/impactos/deploy_full.log 2>&1'
    - >-
      /bin/sh -c 'echo "=== DEPLOY END ===" >> /home1/impactos/deploy_full.log 2>&1'
