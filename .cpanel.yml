---
deployment:
  tasks:
    - /bin/sh -c 'set -e; LOG=/home2/enticonfiamos/public_html/deploy_full.log; API_PATH=/home2/enticonfiamos/public_html/espectacularesapi; APP_PATH=/home2/enticonfiamos/app.enticonfiamos.com.mx; RUN_SEEDERS=false; echo "=== DEPLOY START ===" >> "$LOG" 2>&1; /bin/date >> "$LOG" 2>&1; /bin/mkdir -p "$API_PATH" "$API_PATH/public" "$APP_PATH" >> "$LOG" 2>&1; /bin/cp espectacularesapi/artisan "$API_PATH/" >> "$LOG" 2>&1; /bin/cp espectacularesapi/composer.json "$API_PATH/" >> "$LOG" 2>&1; /bin/cp espectacularesapi/composer.lock "$API_PATH/" >> "$LOG" 2>&1; /bin/cp espectacularesapi/phpunit.xml "$API_PATH/" >> "$LOG" 2>&1; /bin/cp espectacularesapi/run_seeders.php "$API_PATH/" >> "$LOG" 2>&1; /bin/cp -R espectacularesapi/app espectacularesapi/bootstrap espectacularesapi/config espectacularesapi/database espectacularesapi/resources espectacularesapi/routes espectacularesapi/vendor "$API_PATH/" >> "$LOG" 2>&1; /bin/cp espectacularesapi/public/index.php "$API_PATH/public/" >> "$LOG" 2>&1; /bin/cp espectacularesapi/public/.htaccess "$API_PATH/public/" >> "$LOG" 2>&1; if [ ! -e "$API_PATH/public/storage" ]; then /bin/ln -s ../storage/app/public "$API_PATH/public/storage" >> "$LOG" 2>&1; fi; /usr/local/bin/php "$API_PATH/artisan" migrate --force >> "$LOG" 2>&1; if [ "$RUN_SEEDERS" = "true" ]; then /usr/local/bin/php "$API_PATH/artisan" db:seed --class=Database\\Seeders\\QuoteStatusSeeder --force >> "$LOG" 2>&1; /usr/local/bin/php "$API_PATH/artisan" db:seed --class=Database\\Seeders\\QuoteCatalogSeeder --force >> "$LOG" 2>&1; fi; /bin/cp -R espectacularesweb/dist/* "$APP_PATH/" >> "$LOG" 2>&1; echo "=== DEPLOY END ===" >> "$LOG" 2>&1'
