---
deployment:
  tasks:
    - /bin/sh -c 'echo "=== DEPLOY START ===" > /home1/impactos/deploy_full.log 2>&1'
    - /bin/sh -c '/bin/date >> /home1/impactos/deploy_full.log 2>&1'
    - /bin/sh -c '/bin/mkdir -p /home1/impactos/espectacularesapi /home1/impactos/espectacularesapi/public /home1/impactos/public_html >> /home1/impactos/deploy_full.log 2>&1'
    - /bin/sh -c 'cd espectacularesapi && /usr/bin/tar --exclude=.env --exclude=public/storage --exclude=storage -cf - . | (cd /home1/impactos/espectacularesapi && /usr/bin/tar -xf -) >> /home1/impactos/deploy_full.log 2>&1'
    - /bin/sh -c 'if [ ! -e /home1/impactos/espectacularesapi/public/storage ]; then /bin/ln -s ../storage/app/public /home1/impactos/espectacularesapi/public/storage >> /home1/impactos/deploy_full.log 2>&1; fi'
    - /bin/sh -c '/usr/local/bin/php /home1/impactos/espectacularesapi/artisan migrate --force >> /home1/impactos/deploy_full.log 2>&1'
    - /bin/sh -c 'RUN_SEEDERS=false; if [ "$RUN_SEEDERS" = "true" ]; then /usr/local/bin/php /home1/impactos/espectacularesapi/artisan db:seed --class=Database\\Seeders\\QuoteStatusSeeder --force >> /home1/impactos/deploy_full.log 2>&1; /usr/local/bin/php /home1/impactos/espectacularesapi/artisan db:seed --class=Database\\Seeders\\QuoteCatalogSeeder --force >> /home1/impactos/deploy_full.log 2>&1; fi'
    - /bin/sh -c 'if [ -d espectacularesweb/dist ]; then cd espectacularesweb/dist && /usr/bin/tar -cf - . | (cd /home1/impactos/public_html && /usr/bin/tar -xf -) >> /home1/impactos/deploy_full.log 2>&1; else echo "Frontend dist no existe en el repo; se omite despliegue del frontend." >> /home1/impactos/deploy_full.log 2>&1; fi'
    - /bin/sh -c 'echo "=== DEPLOY END ===" >> /home1/impactos/deploy_full.log 2>&1'
