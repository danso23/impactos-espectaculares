services:
  api:
    build:
      context: ./espectacularesapi
      dockerfile: Dockerfile
    container_name: espectaculares_api
    working_dir: /var/www
    volumes:
      - ./espectacularesapi:/var/www
    depends_on:
      - db
    networks:
      - especta_net

  nginx:
    image: nginx:1.25-alpine
    container_name: espectaculares_nginx
    ports:
      - "8080:80"
    volumes:
      - ./espectacularesapi:/var/www
      - ./docker/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - especta_net

  db:
    image: mysql:8.0
    container_name: espectaculares_db
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: espectaculares
      MYSQL_USER: especta_user
      MYSQL_PASSWORD: especta_pass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - especta_net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: espectaculares_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: rootpass
    depends_on:
      - db
    networks:
      - especta_net

  web:
    image: node:20-alpine
    container_name: espectaculares_web
    working_dir: /app
    volumes:
      - ./espectacularesweb:/app
      - /app/node_modules
    command: sh -c "
      corepack enable &&
      corepack prepare pnpm@latest --activate &&
      pnpm install &&
      pnpm run vite:devlocal"
    ports:
      - "5173:5173"
    networks:
      - especta_net

volumes:
  dbdata:

networks:
  especta_net:
    driver: bridge
